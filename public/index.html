<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gogopad</title>
  <link rel="stylesheet" href="styles.css" />
  <link
          rel="stylesheet"
          href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</head>
<body>
<header class="app-header">
  <div class="container">
    <h1 class="app-title">gogopad</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="#weather-section">Weather</a></li>
        <li><a href="#map-section">Map</a></li>
        <li><a href="#facts-section">Facts</a></li>
        <li><a href="#timezone-section">Timezone</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="app-main">
  <!-- Weather Section -->
  <section id="weather-section" class="section weather-section">
    <div class="container">
      <h2 class="section-title">🌦 Weather Information</h2>
      <form id="weather-form" class="form">
        <label for="city" class="form-label">Enter City:</label>
        <input
                type="text"
                id="city"
                name="city"
                class="form-input"
                placeholder="e.g., London"
                required
        />
        <button type="submit" class="btn">Get Weather</button>
      </form>
      <div id="weather-result" class="result"></div>
    </div>
  </section>

  <!-- Map Section -->
  <section id="map-section" class="section map-section">
    <div class="container">
      <h2 class="section-title">🗺 City Location</h2>
      <div id="map" class="map"></div>
    </div>
  </section>

  <!-- Facts Section -->
  <section id="facts-section" class="section facts-section">
    <div class="container">
      <h2 class="section-title">🔍 Random Facts</h2>
      <button id="get-fact-button" class="btn">Get Random Fact</button>
      <div id="facts-result" class="result"></div>
    </div>
  </section>

  <!-- Timezone Section -->
  <section id="timezone-section" class="section timezone-section">
    <div class="container">
      <h2 class="section-title">🕒 Timezone Information</h2>
      <form id="timezone-form" class="form">
        <label for="city-timezone" class="form-label">Enter City:</label>
        <input
                type="text"
                id="city-timezone"
                name="city-timezone"
                class="form-input"
                placeholder="e.g., Tokyo"
                required
        />
        <button type="submit" class="btn">Get Timezone</button>
      </form>
      <div id="timezone-result" class="result"></div>
    </div>
  </section>
</main>

<footer class="app-footer">
  <div class="container">
    <p>Pavel Lukoyanov SE-2331</p>
  </div>
</footer>

<style>
  /* Base Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f4f4f9;
    color: #333;
    overflow-x: hidden;
  }

  .container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .app-header {
    background-color: #4caf50;
    color: white;
    padding: 1rem 0;
    margin-bottom: 1.5rem;
  }

  .app-title {
    text-align: center;
    font-size: 2rem;
  }

  .nav-list {
    display: flex;
    justify-content: center;
    list-style: none;
    margin-top: 0.5rem;
  }

  .nav-list li {
    margin: 0 1rem;
  }

  .nav-list a {
    color: white;
    text-decoration: none;
    font-size: 1.1rem;
  }

  .section {
    margin-bottom: 2rem;
    padding: 1rem;
    background-color: white;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .section-title {
    margin-bottom: 1rem;
    text-align: center;
    font-size: 1.8rem;
    color: #4caf50;
  }

  .form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .form-label {
    flex-basis: 100%;
    text-align: center;
  }

  .form-input {
    padding: 0.5rem;
    font-size: 1rem;
    width: 100%;
    max-width: 300px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  .btn {
    background-color: #4caf50;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-radius: 5px;
    font-size: 1rem;
  }

  .btn:hover {
    background-color: #45a049;
  }

  .result {
    margin-top: 1rem;
    text-align: center;
  }

  .map {
    height: 400px;
    border-radius: 5px;
  }

  .app-footer {
    text-align: center;
    background-color: #4caf50;
    color: white;
    padding: 1rem 0;
  }
</style>
<script src="JS/main.js"></script>
</body>
</html>
